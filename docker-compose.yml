services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: inventario
      POSTGRES_PASSWORD: inventario
      POSTGRES_DB: inventario
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventario -d inventario"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    user: root
    environment:
      ENTORNO: desarrollo
      DATABASE_URL: postgresql+asyncpg://inventario:inventario@db:5432/inventario
      IMAGENES_DIR: /datos/imagenes
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/srv
      - imagenes:/datos/imagenes
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  imagenes:
